<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eff0ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101214" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Kotha Raj Rishi Reddy, CS undergrad at NIT Silchar. Currently building the real-time data pipeline behind AEPS at NPCI." />

    <!-- Open Graph -->
    <!-- TODO: og:url and og:image still point at the old GitHub Pages deploy.
         Point both at the live Vercel domain or social previews stay broken. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rajrishi-06.github.io/portfolio-v2/" />
    <meta property="og:title" content="Raj Rishi Reddy — Software Engineer" />
    <meta property="og:description" content="CS undergrad at NIT Silchar. Currently building the real-time data pipeline behind AEPS at NPCI." />
    <meta property="og:image" content="https://rajrishi-06.github.io/portfolio-v2/images/og.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <title>Raj Rishi Reddy — Software Engineer</title>

    <style>
      /* Critical: paint the sheet immediately, in the right theme, so there is
         no flash before the app mounts. The script below sets the `dark` class
         from storage / system preference before first paint, which is why this
         keys off the class rather than a media query — an explicit choice in
         localStorage has to win over the system preference. */
      html { background-color: #eff0ec; }
      html.dark { background-color: #101214; }
      * { box-sizing: border-box; }
    </style>

    <script>
      // Theme, resolved before first paint. Must stay ahead of the stylesheet
      // so the correct ground colour is the first thing painted.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark = stored ? stored === "dark"
                            : matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
